<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <header></header>
    <main>
        <section class="mx-auto max-w-6xl p-4">
            <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
                <h3 class="text-xl font-bold text-gray-800">Inscriptions</h3>
                <div class="flex items-center gap-3">
                    <span id="count" class="text-sm text-gray-500"></span>
                    <button id="open-registration-form" type="button" aria-controls="registration-form-container"
                        aria-expanded="false" aria-haspopup="dialog"
                        class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-700 hover:cursor-pointer">
                        <i class="fa-solid fa-plus mr-2" aria-hidden="true"></i>Ajouter une inscription
                    </button>
                </div>
            </div>

            <div id="registration-success"
                class="mb-4 hidden rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700"
                role="status" aria-live="polite"></div>

            <div id="registration-form-overlay" class="fixed inset-0 z-40 hidden bg-gray-900/50"></div>

            <section id="registration-form-container"
                class="fixed left-1/2 top-1/2 z-50 hidden max-h-[90vh] w-[calc(100%-2rem)] max-w-3xl -translate-x-1/2 -translate-y-1/2 overflow-y-auto rounded-xl border border-gray-300 bg-white p-4 shadow-xl md:p-6"
                role="dialog" aria-modal="true" aria-labelledby="registration-form-title">
                <div class="mb-4 flex items-start justify-between gap-3">
                    <h4 id="registration-form-title" class="text-lg font-semibold text-gray-800">Nouvelle inscription</h4>
                    <button id="close-registration-form" type="button" aria-label="Fermer le formulaire"
                        class="-mt-1 rounded-lg p-1 text-3xl leading-none text-gray-500 transition hover:bg-gray-100 hover:text-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 hover:cursor-pointer">
                        &times;
                    </button>
                </div>

                <form id="registration-form" class="grid gap-4 md:grid-cols-2" novalidate>
                    <div class="flex flex-col gap-1">
                        <label for="registration-id" class="text-sm font-medium text-gray-700">Numéro de dossier</label>
                        <input id="registration-id" type="text" readonly
                            class="rounded-lg border border-gray-300 bg-gray-100 px-3 py-2 text-sm text-gray-600" />
                        <p class="text-xs text-gray-500">Généré automatiquement.</p>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="registration-student-name" class="text-sm font-medium text-gray-700">
                            Nom et prénom de l'élève <span class="text-red-600">*</span>
                        </label>
                        <input id="registration-student-name" type="text" required minlength="2" maxlength="60"
                            autocomplete="off"
                            class="rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-800 focus:border-blue-500 focus:outline-none" />
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="registration-level" class="text-sm font-medium text-gray-700">
                            Niveau <span class="text-red-600">*</span>
                        </label>
                        <select id="registration-level" required
                            class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800 focus:border-blue-500 focus:outline-none">
                            <option value="">Choisir un niveau</option>
                            <option value="Primaire">Primaire</option>
                            <option value="Collège">Collège</option>
                            <option value="Lycée">Lycée</option>
                            <option value="Bac">Bac</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="registration-course" class="text-sm font-medium text-gray-700">
                            Cours <span class="text-red-600">*</span>
                        </label>
                        <select id="registration-course" required
                            class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800 focus:border-blue-500 focus:outline-none">
                            <option value="">Choisir un cours</option>
                        </select>
                        <p class="text-xs text-gray-500">Capacité maximale : 15 élèves par groupe.</p>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="registration-parent-name" class="text-sm font-medium text-gray-700">
                            Nom et prénom du parent <span class="text-red-600">*</span>
                        </label>
                        <input id="registration-parent-name" type="text" required minlength="2" maxlength="60"
                            autocomplete="off"
                            class="rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-800 focus:border-blue-500 focus:outline-none" />
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="registration-parent-phone" class="text-sm font-medium text-gray-700">
                            Téléphone du parent <span class="text-red-600">*</span>
                        </label>
                        <input id="registration-parent-phone" type="tel" required minlength="10" maxlength="13"
                            inputmode="tel" autocomplete="tel" placeholder="06XXXXXXXX ou +2126XXXXXXXX"
                            class="rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-800 focus:border-blue-500 focus:outline-none" />
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="registration-status" class="text-sm font-medium text-gray-700">
                            Statut <span class="text-red-600">*</span>
                        </label>
                        <select id="registration-status" required
                            class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800 focus:border-blue-500 focus:outline-none">
                            <option value="En attente" selected>En attente</option>
                            <option value="Validée">Validée</option>
                            <option value="Payée">Payée</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="registration-date" class="text-sm font-medium text-gray-700">
                            Date d'inscription <span class="text-red-600">*</span>
                        </label>
                        <input id="registration-date" type="date" required
                            class="rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-800 focus:border-blue-500 focus:outline-none" />
                    </div>

                    <p id="registration-form-error" role="alert"
                        class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 md:col-span-2"></p>

                    <div class="flex flex-wrap gap-3 md:col-span-2">
                        <button type="submit"
                            class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-700 hover:cursor-pointer">
                            Ajouter l'inscription
                        </button>
                        <button id="cancel-registration-form" type="button"
                            class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 transition hover:bg-gray-50 hover:cursor-pointer">
                            Annuler
                        </button>
                    </div>
                </form>
            </section>

            <div class="overflow-x-auto rounded-xl border border-gray-300 bg-white shadow-sm">
                <table id="table" class="w-full text-left text-sm">
                    <caption class="sr-only">Liste des inscriptions</caption>

                    <thead class="border-b border-gray-300 bg-gray-100 text-xs uppercase tracking-wide text-gray-600">
                        <tr class="divide-x divide-gray-300">
                            <th scope="col" class="px-4 py-3 font-semibold">ID</th>
                            <th scope="col" class="px-4 py-3 font-semibold">Parent</th>
                            <th scope="col" class="px-4 py-3 font-semibold">Téléphone</th>
                            <th scope="col" class="px-4 py-3 font-semibold">Élève</th>
                            <th scope="col" class="px-4 py-3 font-semibold">Niveau</th>
                            <th scope="col" class="px-4 py-3 font-semibold">Total / mois</th>
                            <th scope="col" class="px-4 py-3 font-semibold">Paiement</th>
                            <th scope="col" class="px-4 py-3 text-center font-semibold">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="table-body" class="divide-y divide-gray-300 text-gray-700">
                        <!-- rows are generated by JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <footer></footer>
    <script type="module" src="script.js"></script>
</body>

</html>
